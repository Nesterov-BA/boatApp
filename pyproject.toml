[project]
name = "boatapp"
version = "0.2.0"
description = "АСИ: учёт и проверка аварийно-спасательного имущества на судах"
readme = "README.md"
authors = [
    { name = "Nesterov-BA", email = "nesterov.boris123@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyside6>=6.11.2",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
boatapp = "boatapp:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
